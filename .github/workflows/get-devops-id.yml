name: Get Azure DevOps profile ID (one-time)

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  get-id:
    runs-on: ubuntu-latest
    environment: marketplace-publish
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Fetch Azure DevOps profile id
        run: |
          id=$(az rest -u https://app.vssps.visualstudio.com/_apis/profile/profiles/me \
            --resource 499b84ac-1321-427f-aa17-267ca6975798 \
            --query id -o tsv)
          echo "Azure DevOps profile id: $id" | tee -a "$GITHUB_STEP_SUMMARY"
