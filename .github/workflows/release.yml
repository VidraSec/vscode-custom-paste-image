name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Packaging is separate from publishing so that a failed Marketplace publish
  # can be retried by re-running the job, without a half-made GitHub Release
  # in the way.
  package:
    runs-on: ubuntu-latest
    outputs:
      vsix: ${{ steps.package.outputs.vsix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify tag matches package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p 'require("./package.json").version')"
          if [ "$tag" != "$pkg" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $pkg" >&2
            exit 1
          fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Package extension
        id: package
        run: |
          vsix="custom-paste-image-${GITHUB_REF_NAME#v}.vsix"
          npx vsce package --no-dependencies --out "$vsix"
          echo "vsix=$vsix" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: ${{ steps.package.outputs.vsix }}
          if-no-files-found: error

  # Runs before the GitHub Release, so a rejected publish leaves nothing to
  # clean up. Gated on the environment holding the Entra ID federation.
  marketplace:
    needs: package
    runs-on: ubuntu-latest
    environment: marketplace-publish
    permissions:
      contents: read
      id-token: write
    steps:
      # Checked out and installed so the publish uses the vsce version pinned
      # in the lockfile rather than whatever npx resolves on the day.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: vsix

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Publish to Marketplace
        run: npx vsce publish --azure-credential --packagePath "${{ needs.package.outputs.vsix }}"

  release:
    needs: [package, marketplace]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vsix

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VSIX: ${{ needs.package.outputs.vsix }}
        run: |
          # Idempotent, so re-running after a partial failure is safe.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$VSIX" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              "$VSIX"
          fi
